name: Build NotiAlarm APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias notialarm \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=NotiAlarm, OU=App, O=NotiAlarm, L=Server, S=Global, C=US"
          
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          
          ${BUILD_TOOLS_DIR}apksigner sign \
            --ks release.keystore \
            --ks-key-alias notialarm \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out app-release-signed.apk \
            $UNSIGNED_APK

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiAlarm-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiAlarm-Release-APK
          path: app-release-signed.apk
